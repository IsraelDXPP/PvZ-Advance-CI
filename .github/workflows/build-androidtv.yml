# CI build para IsraelDXPP/PvZ-AndroidTVDecomp (decompilacion de PvZ TV /
# Android con SDL3 + bgfx).
#
# Mismo sistema que build.yml y build-greatwall.yml: este repo hace checkout
# del repo fuente y compila todas las plataformas: escritorio (Windows x64/x86,
# macOS arm64/x64, Linux x64/arm64), Android (4 ABIs) e iOS (IPA ad-hoc). Las
# recetas son las de build.yml del repo fuente; los assets del juego (copyright
# PopCap) los baja cada job, no estan en ningun repo.
#
# Setup (opcional): el repo fuente es publico y se lee con el token por
# defecto. Si pasara a privado, crear un fine-grained PAT con Contents: Read en
# ese repo y agregarlo como ANDROIDTV_SOURCE_TOKEN en este repo
# (Settings > Secrets and variables > Actions). Para firmar el APK con una
# clave propia, agregar ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD; sin ellas se usa la clave debug.

name: CI build (PvZ AndroidTV Decomp)

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'Branch or tag of IsraelDXPP/PvZ-AndroidTVDecomp to build'
        required: true
        default: 'main'
  push:
    branches: [ "main" ]
    tags: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: IsraelDXPP/PvZ-AndroidTVDecomp

jobs:
  desktop:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: windows-x64-release, os: windows-2022, arch: x64 }
          - { preset: windows-x86-release, os: windows-2022, arch: x86 }
          - { preset: macos-arm64-release, os: macos-15 }
          - { preset: macos-x64-release,   os: macos-15-intel }
          - { preset: linux-x64-release,   os: ubuntu-24.04 }
          - { preset: linux-arm64-release, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN || secrets.ANDROIDTV_SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.source-ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libibus-1.0-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxtst-dev \
            libasound2-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libltdl-dev

      - name: Dependencias del sistema (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config || true

      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Entorno MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Cache de vcpkg (repo + bootstrap)
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-repo-${{ hashFiles('vcpkg.json') }}
      - name: vcpkg en el commit baseline del proyecto
        shell: bash
        run: |
          if [ ! -d vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg
          fi
          cd vcpkg
          git fetch --depth 1 origin "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")" 2>/dev/null || git fetch origin
          git checkout "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")"
          if [ "$RUNNER_OS" = "Windows" ]; then ./bootstrap-vcpkg.bat -disableMetrics; else ./bootstrap-vcpkg.sh -disableMetrics; fi
          cd ..
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: ccache
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ccache -y --no-progress; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache || true; fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y ccache; fi
      - name: Cache de ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'Lawn/**', 'Sexy/**', 'TodLib/**') }}
      - name: Configurar
        shell: bash
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compilar
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: LawnTV-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/bin/Release/
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN || secrets.ANDROIDTV_SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.source-ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK, NDK y herramientas
        run: |
          # El runner ya trae el SDK de Android; solo se agregan las piezas pedidas.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;26.1.10909125" "cmake;3.31.6" > /dev/null
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf automake libtool pkg-config
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Cache de vcpkg (repo + bootstrap)
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-repo-android-${{ hashFiles('vcpkg.json') }}
      - name: vcpkg en el commit baseline del proyecto
        run: |
          if [ ! -d vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg
          fi
          cd vcpkg
          git checkout "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")"
          ./bootstrap-vcpkg.sh -disableMetrics
          cd ..
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$PWD/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$PWD/vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-android-${{ matrix.abi }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/**') }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Assets del juego (Android)
        env:
          GAME_ASSETS_URL: https://drive.usercontent.google.com/download?id=1h-Cvuf4Zz3SVjRXbpoBetR9Z-ZzQ-R5D&export=download&confirm=t
        run: |
          set -e
          curl -fsSL "$GAME_ASSETS_URL" -o /tmp/assets.zip
          unzip -q /tmp/assets.zip -d /tmp/assets
          # El juego espera: assets/main.pak (pack) + assets/files/ (archivos sueltos).
          # El zip de Drive trae subcarpetas: properties/, images/, reanim/, etc.
          # Las copiamos a src/main/assets/files/ y nos aseguramos de que main.pak exista.
          ASSET_ROOT=android/app/src/main/assets
          FILES_DIR=$ASSET_ROOT/files
          rm -rf "$ASSET_ROOT"
          mkdir -p "$ASSET_ROOT" "$FILES_DIR"
          if [ -f /tmp/assets/properties/levels.xml ] || [ -f /tmp/assets/files/properties/levels.xml ]; then
            # Zip con subcarpetas: mover todo a files/
            if [ -f /tmp/assets/files/properties/levels.xml ]; then
              cp -R /tmp/assets/files/. "$FILES_DIR/"
            else
              cp -R /tmp/assets/. "$FILES_DIR/"
            fi
            # Ensure shaders and compiled reanims are present (collect from any location).
            mkdir -p "$FILES_DIR/shaders" "$FILES_DIR/compiled/reanim"
            find /tmp/assets -name '*.scbp' -exec cp {} "$FILES_DIR/shaders/" \; 2>/dev/null || true
            find /tmp/assets -name '*.compiled' -exec cp {} "$FILES_DIR/compiled/reanim/" \; 2>/dev/null || true
          else
            # Zip plano: clasificar por extensión en files/ subcarpetas
            mkdir -p "$FILES_DIR/properties" "$FILES_DIR/images" "$FILES_DIR/reanim" \
                     "$FILES_DIR/data" "$FILES_DIR/sounds" "$FILES_DIR/shaders"
            mv /tmp/assets/*.xml "$FILES_DIR/properties/" 2>/dev/null || true
            mv /tmp/assets/*.txt "$FILES_DIR/data/" 2>/dev/null || true
            mv /tmp/assets/*.{ogg,wav,xm,mpg} "$FILES_DIR/sounds/" 2>/dev/null || true
            mv /tmp/assets/*.scbp "$FILES_DIR/shaders/" 2>/dev/null || true
            mkdir -p "$FILES_DIR/compiled/reanim"
            mv /tmp/assets/*.compiled "$FILES_DIR/compiled/reanim/" 2>/dev/null || true
            mv /tmp/assets/*.png /tmp/assets/*.jpg /tmp/assets/*.gif "$FILES_DIR/images/" 2>/dev/null || true
          fi
          # El juego requiere main.pak en la raíz de assets (AssetInstaller crashea si falta).
          # El zip no trae main.pak; creamos uno vacío como fallback para que no crashee
          # y el juego use los archivos sueltos de files/ como fallback.
          if [ ! -f "$ASSET_ROOT/main.pak" ]; then
            echo "main.pak no encontrado en assets; creando fallback vacío"
            touch "$ASSET_ROOT/main.pak"
          fi
          # Sin shaders el renderizador no arranca. Los paquetes del repo cubren
          # lo que el zip no traiga.
          mkdir -p "$FILES_DIR/shaders"
          cp -n Shaders/*.scbp "$FILES_DIR/shaders/"
          echo "Estructura assets:"; ls -la "$ASSET_ROOT"
          echo "Archivos en files/:"; find "$ASSET_ROOT/files" -type f | wc -l
          echo "Tamanio total:"; du -sh "$ASSET_ROOT"

      - name: Firma (siempre)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/keystore.properties
          else
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            fi
          fi

      - name: APK (release)
        working-directory: android
        run: sh ./gradlew :app:assembleRelease -PlawnAbis=${{ matrix.abi }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LawnTV-android-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: ios-arm64
    runs-on: macos-15
    env:
      IPA_NAME: LawnTV-unsigned.ipa
      APP: Payload/LawnTV.app
      DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN || secrets.ANDROIDTV_SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.source-ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Xcode y herramientas
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          which ninja || brew install ninja
          python3 --version

      - name: Cache de vcpkg (repo + bootstrap)
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-repo-ios-${{ hashFiles('vcpkg.json') }}
      - name: vcpkg en el commit baseline del proyecto
        run: |
          if [ ! -d vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg
          fi
          cd vcpkg
          # El baseline de vcpkg.json fija la version de los ports. El tool
          # tiene que ser el de ese commit: uno mas viejo no entiende el
          # esquema de scripts/vcpkg-tools.json de ese commit.
          git checkout "$(python3 -c "import json;print(json.load(open('../vcpkg.json'))['builtin-baseline'])")"
          ./bootstrap-vcpkg.sh -disableMetrics
          cd ..
          # vcpkg exige que el destino de la cache sea un directorio.
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$PWD/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$PWD/vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$PWD/vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-ios-${{ hashFiles('vcpkg.json') }}

      - name: Configurar (iOS arm64)
        run: |
          cmake --preset ios-arm64-release
          cmake --build --preset ios-arm64-release --parallel

      - name: Empaquetar .app
        run: |
          APP_BUNDLE=build/ios-arm64-release/bin/Release/LawnTV.app
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "ERROR: No existe el bundle $APP_BUNDLE"
            ls -la build/ios-arm64-release/bin/Release/
            exit 1
          fi
          EXE="$APP_BUNDLE/LawnTV"
          file "$EXE"
          nm "$EXE" | grep -E " T _main$| T _SDL_main$" || (echo "FALTA main/SDL_main" && exit 1)
          rm -rf Payload
          APP=Payload/LawnTV.app
          mkdir -p "$APP/Base.lproj"
          # Copiar el ejecutable al nuevo bundle
          cp "$EXE" "$APP/LawnTV"
          # Info.plist base + assets
          cp ios/Info.plist "$APP/"
          plutil -lint "$APP/Info.plist"
          ibtool --compile "$APP/Base.lproj/LaunchScreen.storyboardc" ios/LaunchScreen.storyboard
          xcrun actool --compile "$APP" --platform iphoneos --minimum-deployment-target "$DEPLOYMENT_TARGET" \
            --target-device iphone --target-device ipad --app-icon AppIcon \
            --output-partial-info-plist /tmp/actool-partial.plist \
            --output-format human-readable-text ios/Assets.xcassets
          ls -la "$APP"

      - name: Assets del juego
        env:
          GAME_ASSETS_URL: https://drive.usercontent.google.com/download?id=1h-Cvuf4Zz3SVjRXbpoBetR9Z-ZzQ-R5D&export=download&confirm=t
        run: |
          curl -fsSL "$GAME_ASSETS_URL" -o /tmp/assets.zip
          unzip -q /tmp/assets.zip -d /tmp/assets
          # El zip de Drive trae properties/, images/, reanim/, data/, sounds/
          # y shaders/ directamente; el juego lee properties/levels.xml y
          # resources.xml con SetDefaults path="images|reanim|data|sounds".
          # Si bajara plano, clasificar por extension en las carpetas del juego.
          if [ -f /tmp/assets/properties/levels.xml ] || [ -f /tmp/assets/files/properties/levels.xml ]; then
            mkdir -p "$APP/assets"
            if [ -f /tmp/assets/files/properties/levels.xml ]; then
              cp -R /tmp/assets/files/. "$APP/assets/"
            else
              cp -R /tmp/assets/. "$APP/assets/"
            fi
            mkdir -p "$APP/assets/shaders" "$APP/assets/compiled/reanim"
            find /tmp/assets -name '*.scbp' -exec cp {} "$APP/assets/shaders/" \; 2>/dev/null || true
            find /tmp/assets -name '*.compiled' -exec cp {} "$APP/assets/compiled/reanim/" \; 2>/dev/null || true
          else
            mkdir -p "$APP/assets/properties" "$APP/assets/images" "$APP/assets/reanim" \
                     "$APP/assets/data" "$APP/assets/sounds" "$APP/assets/shaders" \
                     "$APP/assets/compiled/reanim"
            mv /tmp/assets/*.xml "$APP/assets/properties/" 2>/dev/null || true
            mv /tmp/assets/*.txt "$APP/assets/data/" 2>/dev/null || true
            mv /tmp/assets/*.{ogg,wav,xm,mpg} "$APP/assets/sounds/" 2>/dev/null || true
            find /tmp/assets -name '*.scbp' -exec cp {} "$APP/assets/shaders/" \; 2>/dev/null || true
            find /tmp/assets -name '*.compiled' -exec cp {} "$APP/assets/compiled/reanim/" \; 2>/dev/null || true
            mv /tmp/assets/*.png /tmp/assets/*.jpg /tmp/assets/*.gif "$APP/assets/images/" 2>/dev/null || true
          fi
          # Sin shaders el renderizador no arranca (la app se cierra al iniciar).
          mkdir -p "$APP/assets/shaders"
          cp -n Shaders/*.scbp "$APP/assets/shaders/"
          ls "$APP/assets" | head

      - name: Firma ad-hoc e IPA
        run: |
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"
          zip -qry "$IPA_NAME" Payload
          ls -la "$IPA_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: LawnTV-unsigned-ipa
          path: ${{ env.IPA_NAME }}

  release:
    name: Release (PvZ AndroidTV Decomp)
    needs: ['desktop', 'android', 'ios']
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir release_files
          # Escritorio: una carpeta por preset (ejecutable + dependencias, sin assets)
          for dir in artifacts/LawnTV-*-release; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release_files/${name}.zip" .)
          done
          for apk in artifacts/LawnTV-android-*/*.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$(dirname "$apk")")
            cp "$apk" "release_files/${abi}.apk"
          done
          cp artifacts/LawnTV-unsigned-ipa/*.ipa release_files/LawnTV-ios-arm64-unsigned.ipa
          ls -lh release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'androidtv-latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'PvZ AndroidTV Decomp (latest)' }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
