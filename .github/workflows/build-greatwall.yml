    - name: Binario, assets y tablas derivadas del binario del iPad
      shell: bash
      run: |
        mkdir -p bin data/generated/ipad
        if [ ! -f bin/PvZ-iPad_ZH_1.9.10 ]; then
          python tools/remote_zip.py --item "$IPA_ITEM" "$IPA_NAME" \
            --get "$IPAD_APP/PvZ-iPad_ZH" --out bin/PvZ-iPad_ZH_1.9.10
        fi
        if [ ! -f assets/ipad/main.rsb ]; then
          python tools/remote_zip.py --item "$IPA_ITEM" "$IPA_NAME" \
            --extract assets/ipad --strip "$IPAD_APP/" \
            --match "PvZ-iPad_ZH\.app/(main\.rsb|properties/|zh-Hans\.lproj/|compiled/|music/|store\.plist)"
        fi
        python tools/macho_symbols.py bin/PvZ-iPad_ZH_1.9.10 --stabs > data/debugmap_ipad.tsv
        python tools/macho_symbols.py bin/PvZ-iPad_ZH_1.9.10 > data/gwe_ipad_symbols.txt
        python tools/resgen.py --ipad
        python tools/resglobals.py --ipad
        python tools/layoutconsts.py --ipad
        python tools/subgroups.py --ipad
        python tools/lawntables.py --ipad
        ls data/generated/ipad/

    - name: APK (nativo + dex + firma debug)
      run: python3 tools/android_apk.py --target ipad --out PvZGreatWallHD.apk

    - name: Verificar firma y contenido
      run: |
        APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | head -1)
        "$APKSIGNER" verify PvZGreatWallHD.apk
        unzip -l PvZGreatWallHD.apk | grep -E "classes.dex|lib/arm64-v8a/lib(main|SDL2)|assets/main.rsb|mipmap-xxxhdpi" || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvzgreatwall-hd-android
        path: PvZGreatWallHD.apk

  release:
    name: Release (PvZ Great Wall)
    needs: ['build-greatwall-windows', 'build-greatwall-ios', 'build-greatwall-android',
            'build-greatwall-ipad-windows', 'build-greatwall-ipad-ios', 'build-greatwall-ipad-android']
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare Release Files
      run: |
        mkdir release_files
        mv artifacts/pvzgreatwall-windows/pvz-greatwall.exe release_files/pvzgreatwall-windows-x86_64.exe
        mv artifacts/pvzgreatwall-windows/SDL2.dll release_files/SDL2.dll
        mv artifacts/pvzgreatwall-windows/zlib1.dll release_files/zlib1.dll
        mv artifacts/pvzgreatwall-ios/PvZGreatWall-unsigned.ipa release_files/pvzgreatwall-ios-arm64.ipa
        mv artifacts/pvzgreatwall-android/PvZGreatWall.apk release_files/pvzgreatwall-android-arm64-v8a.apk
        # La variante HD (iPad): su .exe, su .ipa y su .apk
        mv artifacts/pvzgreatwall-hd-windows/pvz-greatwall.exe release_files/pvzgreatwall-hd-windows-x86_64.exe
        mv artifacts/pvzgreatwall-hd-windows/SDL2.dll release_files/SDL2-HD.dll
        mv artifacts/pvzgreatwall-hd-windows/zlib1.dll release_files/zlib1-HD.dll
        mv artifacts/pvzgreatwall-hd-ios/PvZGreatWallHD-unsigned.ipa release_files/pvzgreatwall-hd-ios-arm64.ipa
        mv artifacts/pvzgreatwall-hd-android/PvZGreatWallHD.apk release_files/pvzgreatwall-hd-android-arm64-v8a.apk
        ls -lh release_files/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_files/*
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'greatwall-latest' }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || 'PvZ Great Wall (latest)' }}
        generate_release_notes: true
        draft: false
        prerelease: ${{ github.ref_type != 'tag' }}
