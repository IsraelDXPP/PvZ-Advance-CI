# Complete Xbox Dev Mode UWP build for the public LawnTVDecomp source tree.
#
# The game uses its SDL3 API compatibility layer over SDL2/WinRT, bgfx D3D11,
# Xbox-compatible controllers and the same external asset bundle as Android/iOS.
name: LawnTV Xbox UWP complete game

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Branch or tag of LawnTVDecomp to build
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lawntv-uwp.yml'

concurrency:
  group: lawntv-uwp-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: IsraelDXPP/PvZ-AndroidTVDecomp
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

jobs:
  xbox-uwp-x64:
    name: Xbox One / Series UWP x64
    runs-on: windows-2022
    steps:
      - name: Checkout LawnTVDecomp
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.ANDROIDTV_SOURCE_TOKEN || secrets.PRIVATE_SOURCE_TOKEN || github.token }}
          ref: ${{ inputs.source-ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC UWP environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          uwp: true

      - name: Ensure C++ UWP workload
        shell: pwsh
        run: |
          $vs = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          $xamlTargets = Join-Path $vs 'MSBuild\Microsoft\WindowsXaml'
          if (-not (Test-Path $xamlTargets)) {
            $installer = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe'
            if (-not (Test-Path $installer)) { throw 'Visual Studio installer not found' }
            & $installer modify --installPath $vs `
              --add Microsoft.VisualStudio.Workload.Universal `
              --includeRecommended --quiet --norestart
            if ($LASTEXITCODE -ne 0) { throw 'Installing the UWP workload failed' }
          }

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

      - name: Restore vcpkg repository
        id: vcpkg-repository
        uses: actions/cache/restore@v5
        with:
          path: vcpkg
          key: lawntv-uwp-vcpkg-repo-${{ hashFiles('uwp/vcpkg.json') }}

      - name: Use the project vcpkg baseline
        shell: bash
        run: |
          set -e
          if [ ! -d vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg vcpkg
          fi
          baseline=$(python3 -c "import json; print(json.load(open('uwp/vcpkg.json'))['builtin-baseline'])")
          git -C vcpkg fetch origin "$baseline" --depth 1 || git -C vcpkg fetch origin
          git -C vcpkg checkout "$baseline"
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          mkdir -p vcpkg-cache
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Save vcpkg repository
        if: steps.vcpkg-repository.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: vcpkg
          key: ${{ steps.vcpkg-repository.outputs.cache-primary-key }}

      - name: Restore UWP dependency binaries
        id: uwp-dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            vcpkg-cache
            vcpkg_installed/xbox-uwp-x64-release
          key: lawntv-uwp-x64-release-v3-${{ hashFiles('uwp/vcpkg.json', 'cmake/triplets/lawn-x64-uwp.cmake') }}
          restore-keys: |
            lawntv-uwp-x64-release-v3-
            lawntv-uwp-x64-release-v2-

      - name: Restore incremental UWP build
        id: uwp-build
        uses: actions/cache/restore@v5
        with:
          path: build/xbox-uwp-x64-release
          key: lawntv-uwp-build-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'Lawn/**', 'Sexy/**', 'TodLib/**', 'uwp/**', 'Shaders/**') }}-${{ github.run_id }}
          restore-keys: |
            lawntv-uwp-build-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'Lawn/**', 'Sexy/**', 'TodLib/**', 'uwp/**', 'Shaders/**') }}-
            lawntv-uwp-build-v2-

      - name: Restore tracked source timestamps
        shell: pwsh
        env:
          CURRENT_BUILD_PREFIX: lawntv-uwp-build-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'Lawn/**', 'Sexy/**', 'TodLib/**', 'uwp/**', 'Shaders/**') }}-
          RESTORED_BUILD_KEY: ${{ steps.uwp-build.outputs.cache-matched-key }}
        run: |
          @'
          import os
          import pathlib
          import subprocess
          import time

          tracked = set(subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8").splitlines())
          mtimes = {}
          process = subprocess.Popen(
              ["git", "-c", "core.quotepath=false", "log", "--format=@@%ct", "--name-only", "--no-renames"],
              stdout=subprocess.PIPE, text=True, encoding="utf-8", errors="replace")
          commit_time = None
          for raw_line in process.stdout:
              line = raw_line.rstrip("\r\n")
              if line.startswith("@@"):
                  commit_time = int(line[2:])
              elif line and commit_time is not None and line in tracked and line not in mtimes:
                  mtimes[line] = commit_time
          process.wait()

          head_time = int(subprocess.check_output(
              ["git", "show", "-s", "--format=%ct", "HEAD"], text=True).strip())
          for name in tracked:
              path = pathlib.Path(name)
              if path.is_file():
                  stamp = mtimes.get(name, head_time)
                  os.utime(path, (stamp, stamp))

          marker = pathlib.Path("build/xbox-uwp-x64-release/.lawntv-source-commit")
          restored_key = os.environ.get("RESTORED_BUILD_KEY", "")
          exact_source = restored_key.startswith(os.environ["CURRENT_BUILD_PREFIX"])
          changed = set()
          if marker.is_file():
              base = marker.read_text(encoding="ascii").strip()
              exists = subprocess.run(
                  ["git", "cat-file", "-e", base + "^{commit}"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if exists:
                  changed.update(subprocess.check_output(
                      ["git", "diff", "--name-only", base, "HEAD"],
                      text=True, encoding="utf-8").splitlines())
              elif not exact_source:
                  changed.update(tracked)
          elif not exact_source:
              changed.update(tracked)

          now = time.time()
          touched = 0
          for name in changed:
              path = pathlib.Path(name)
              if path.is_file():
                  os.utime(path, (now, now))
                  touched += 1
          print(f"Restored timestamps for {len(mtimes)} tracked files; forced {touched} changed files newer")
          '@ | python -

      - name: Configure
        shell: pwsh
        run: cmake --preset xbox-uwp-x64-release

      - name: Save UWP dependency binaries
        if: steps.uwp-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            vcpkg-cache
            vcpkg_installed/xbox-uwp-x64-release
          key: ${{ steps.uwp-dependencies.outputs.cache-primary-key }}

      - name: Build
        id: build
        shell: pwsh
        run: cmake --build --preset xbox-uwp-x64-release --parallel

      - name: Record incremental build source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/xbox-uwp-x64-release | Out-Null
          git rev-parse HEAD | Set-Content -NoNewline -Encoding ascii build/xbox-uwp-x64-release/.lawntv-source-commit

      - name: Save incremental UWP build
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build/xbox-uwp-x64-release
          key: ${{ steps.uwp-build.outputs.cache-primary-key }}

      - name: Download and arrange game assets
        shell: pwsh
        env:
          GAME_ASSETS_URL: https://drive.usercontent.google.com/download?id=1MxknxYw4Sx4h42ErvQhthv3dRCcfah9Q&export=download&confirm=t
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'lawntv-assets.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'lawntv-assets-expanded'
          curl.exe -L --fail --silent --show-error $env:GAME_ASSETS_URL -o $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force

          $levels = Get-ChildItem $expanded -Recurse -File -Filter levels.xml |
            Where-Object { $_.Directory.Name -eq 'properties' } |
            Select-Object -First 1
          if (-not $levels) { throw 'The asset archive has no properties/levels.xml' }
          $filesSource = $levels.Directory.Parent.FullName
          $assetRoot = 'uwp-game-assets/assets'
          $filesTarget = Join-Path $assetRoot 'files'
          New-Item -ItemType Directory -Force -Path $filesTarget | Out-Null
          Copy-Item (Join-Path $filesSource '*') $filesTarget -Recurse -Force

          $mainPak = Get-ChildItem $expanded -Recurse -File -Filter main.pak | Select-Object -First 1
          if ($mainPak) {
            Copy-Item $mainPak.FullName (Join-Path $assetRoot 'main.pak') -Force
          } else {
            New-Item -ItemType File -Force -Path (Join-Path $assetRoot 'main.pak') | Out-Null
          }

          $shaderTarget = Join-Path $filesTarget 'shaders'
          New-Item -ItemType Directory -Force -Path $shaderTarget | Out-Null
          Get-ChildItem Shaders -Filter *.scbp | ForEach-Object {
            $target = Join-Path $shaderTarget $_.Name
            if (-not (Test-Path $target)) { Copy-Item $_.FullName $target }
          }
          $fileCount = (Get-ChildItem $filesTarget -Recurse -File).Count
          if ($fileCount -lt 100) { throw "Asset staging produced only $fileCount files" }
          if (-not (Get-ChildItem $shaderTarget -Filter *.scbp)) { throw 'No SCBP shaders were staged' }
          Write-Host "Staged $fileCount game files"

      - name: Stage AppX payload
        shell: pwsh
        run: |
          $build = 'build/xbox-uwp-x64-release'
          $payload = 'appx'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item "$build/bin/Release/LawnTV.exe" $payload
          Copy-Item "$build/uwp/Package.appxmanifest" "$payload/AppxManifest.xml"
          Copy-Item -Recurse "$build/uwp/Assets" "$payload/Assets"
          # AppX paths are case-insensitive. Package logos already occupy
          # `Assets`, so merge the game asset root into that directory instead
          # of creating the broken `Assets/assets/files` nesting.
          Copy-Item 'uwp-game-assets/assets/*' "$payload/Assets" -Recurse -Force
          if (-not (Test-Path "$payload/Assets/files/properties/levels.xml")) {
            throw 'Packaged game assets are not at Assets/files'
          }

          $uwpBin = 'vcpkg_installed/xbox-uwp-x64-release/lawn-x64-uwp/bin'
          Get-ChildItem $uwpBin -Filter *.dll -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName $payload }
          if (-not (Test-Path "$payload/SDL2.dll")) { throw 'SDL2.dll was not staged' }

          # AppContainer CRT DLLs come from the UWP VCLibs framework package.
          $vclibsRoot = 'C:\Program Files (x86)\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs'
          $vclibs = Get-ChildItem $vclibsRoot -Recurse -Filter 'Microsoft.VCLibs.*.appx' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'x64' -and $_.Name -notmatch 'Debug|UWPDesktop' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vclibs) {
            $download = Join-Path $env:RUNNER_TEMP 'lawntv-vclibs-download'
            winget download --id Microsoft.VCLibs.14 -e --architecture x64 `
              --accept-source-agreements --download-directory $download | Out-Null
            $archive = Get-ChildItem $download -Recurse -Filter *.zip -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($archive) {
              $expanded = Join-Path $env:RUNNER_TEMP 'lawntv-vclibs-expanded'
              Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded -Force
              $vclibs = Get-ChildItem $expanded -Recurse -Filter 'Microsoft.VCLibs.140.00_*.appx' |
                Where-Object { $_.Name -match 'x64' -and $_.Name -notmatch 'Debug|UWPDesktop' } |
                Select-Object -First 1
            }
          }
          if (-not $vclibs) { throw 'Microsoft.VCLibs x64 UWP framework package not found' }
          $crt = Join-Path $env:RUNNER_TEMP 'lawntv-vclibs'
          Expand-Archive -LiteralPath $vclibs.FullName -DestinationPath $crt -Force
          @('vcruntime140_app.dll', 'vcruntime140_1_app.dll', 'msvcp140_app.dll',
            'msvcp140_1_app.dll', 'msvcp140_2_app.dll', 'concrt140_app.dll',
            'vccorlib140_app.dll') | ForEach-Object {
              $file = Get-ChildItem $crt -Recurse -Filter $_ -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($file) { Copy-Item $file.FullName $payload }
            }
          Get-ChildItem $payload -Recurse | Select-Object FullName, Length

      - name: Pack and sign AppX
        shell: pwsh
        env:
          LAWNTV_UWP_SIGN_PFX: ${{ secrets.LAWNTV_UWP_SIGN_PFX }}
          LAWNTV_UWP_SIGN_PASS: ${{ secrets.LAWNTV_UWP_SIGN_PASS }}
        run: |
          $sdk = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $makeappx = Get-ChildItem $sdk -Recurse -Filter makeappx.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Get-ChildItem $sdk -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx -or -not $signtool) { throw 'Windows SDK AppX tools not found' }

          [xml]$manifest = Get-Content appx/AppxManifest.xml
          $name = $manifest.Package.Identity.Name
          $publisher = $manifest.Package.Identity.Publisher
          $version = $manifest.Package.Identity.Version
          $appx = "LawnTV-UWP_${version}_x64.appx"
          & $makeappx.FullName pack /d appx /p $appx /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx failed' }

          $password = $env:LAWNTV_UWP_SIGN_PASS
          if ($env:LAWNTV_UWP_SIGN_PFX) {
            [IO.File]::WriteAllBytes('lawntv-sign.pfx', [Convert]::FromBase64String($env:LAWNTV_UWP_SIGN_PFX))
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation Cert:\CurrentUser\My
            $password = [Guid]::NewGuid().ToString('N')
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            Export-PfxCertificate -Cert $cert -FilePath lawntv-sign.pfx -Password $secure -Force | Out-Null
            Export-Certificate -Cert $cert -FilePath LawnTV-UWP-Dev.cer -Type CERT | Out-Null
          }
          & $signtool.FullName sign /f lawntv-sign.pfx /p $password /fd SHA256 /a $appx
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $appx artifacts/
          Copy-Item LawnTV-UWP-Dev.cer artifacts/ -ErrorAction SilentlyContinue
          Copy-Item uwp/README.md artifacts/

      - name: Upload signed complete-game package
        uses: actions/upload-artifact@v4
        with:
          name: LawnTV-xbox-uwp-complete-x64
          path: artifacts/
          if-no-files-found: error
